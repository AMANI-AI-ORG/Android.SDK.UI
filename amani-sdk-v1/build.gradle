plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'maven-publish'
}

android {
    compileSdk 36

    namespace 'ai.amani.amani_sdk'

    defaultConfig {
        minSdk 23
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    dataBinding {
        enabled = true
    } // Add this line to enable data binding feature.

    viewBinding {
        enabled = true
    }

    buildFeatures {
        compose true
    }

    // Exposes `components.release` for maven-publish (required since AGP 7.1). Without this
    // the publish task fails with "Could not find component 'release'". withSourcesJar() ships
    // sources so consumers get parameter names / KDoc in the IDE.
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    packaging {
        resources {
            it.excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }

    testOptions {
        packaging {
            resources {
                // MockK pulls in JUnit Jupiter transitively, causing duplicate licence files.
                it.excludes += "META-INF/LICENSE.md"
                it.excludes += "META-INF/LICENSE-notice.md"
                it.excludes += "META-INF/NOTICE.md"
            }
        }
    }
}

dependencies {

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    def appcompat_version = "1.5.0"

    implementation "androidx.appcompat:appcompat:$appcompat_version"
    // For loading and tinting drawables on older versions of the platform
    implementation "androidx.appcompat:appcompat-resources:$appcompat_version"

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
    // ── Unit tests ─────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    // LiveData test helper (InstantTaskExecutorRule)
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    // MockK for mocking concrete Kotlin classes (incl. NFCRepositoryImp, Tag, Intent)
    testImplementation 'io.mockk:mockk:1.13.12'
    // Coroutines test support (if Flow is introduced later)
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'

    // ── Instrumentation tests ───────────────────────────────────────────────────
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // FragmentScenario — launch fragments in isolation
    androidTestImplementation 'androidx.fragment:fragment-testing:1.8.5'
    // Core test rules and runners
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    // LiveData test helper (InstantTaskExecutorRule in androidTest)
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    // MockK for Android (mocks final classes on Dalvik/ART)
    androidTestImplementation 'io.mockk:mockk-android:1.13.12'

    // ViewModel and lifecycle support for kotlin
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"

    // ── Jetpack Compose (V2 UI style) ───────────────────────────────────────────
    def compose_bom = "2024.09.03"
    implementation platform("androidx.compose:compose-bom:$compose_bom")
    androidTestImplementation platform("androidx.compose:compose-bom:$compose_bom")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.activity:activity-compose:1.9.3"
    // Compose ViewModel + lifecycle-aware state collection for the V2 flow. The whole
    // androidx.lifecycle group self-aligns to one version, so these resolve to 2.8.7 as
    // long as nothing drags the group higher — see the navigation pin below. The 2.9.x
    // lifecycle line would need compileSdk 35 + AGP 8.6, which the app (compileSdk 34)
    // isn't on yet, so staying on 2.8.x keeps both modules force-free.
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Lottie for Compose (V2). lottie-compose renders inside @Preview (unlike the
    // view-based LottieAnimationView hosted via AndroidView, which is blank in inspection).
    // NOTE: this pulls lottie core up from the 3.6.1 that AmaniAi transitively provides to
    // 6.x for the whole module — the version-based usages in v1 (NfcScanScreen, selfie
    // instruction animations) resolve to 6.x too. Pinned together to avoid a split.
    def lottie_version = "6.1.0"
    implementation "com.airbnb.android:lottie:$lottie_version"
    implementation "com.airbnb.android:lottie-compose:$lottie_version"

    // AmaniSDK impl
    def amani_sdk = "3.21.4"
    api "ai.amani.android:AmaniAi:$amani_sdk"

    // Optional speech-verification module — compileOnly ON PURPOSE: the UI SDK compiles
    // against its public API (see presentation_v2/speech_verify) but does NOT bundle it, so
    // apps that never use the speech (`ST`) step carry none of its weight 
    // Without it, entering an `ST` step fails with a descriptive runtime error
    // (SpeechVerifierAvailability) instead of silently doing nothing.
    def speech_verifier = "1.1.1"
    compileOnly "ai.amani.android:amani-speech-verifier:$speech_verifier"

    // Nav graph. Pinned to the 2.8.x line on purpose: navigation 2.9.x transitively
    // requires the androidx.lifecycle 2.9.x group (which self-aligns and would pull the
    // lifecycle-*-compose artifacts to 2.9.x, demanding compileSdk 35 + AGP 8.6). Staying
    // on 2.8.9 keeps the whole lifecycle group at 2.8.7 with no resolutionStrategy.force —
    // here or in the consuming app. Revisit when the app moves to compileSdk 35 + AGP 8.6.
    def nav_version = "2.8.9"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    api 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.hbb20:ccp:2.5.3' // CountryCodePicker library
    implementation 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:3.0.0-RC3'

    // Optional Voice Assistant (TTS) — compileOnly ON PURPOSE, same contract as the
    // speech-verification module above: the UI SDK compiles against its API but does NOT
    // bundle it, so apps that never want voice prompts carry none of its weight. Without it
    // every voice call is a silent no-op (see VoiceAssistantSDKManager's presence guard).
    // The consuming app adds it as a real runtime dependency to enable voice.
    compileOnly 'ai.amani:Android.SDK.AmaniVoiceAssistant:1.1.0'

    implementation 'com.github.bumptech.glide:glide:5.0.7'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.AMANI-AI-ORG'
                artifactId = 'Android.SDK.UI'
                version = '1.42.0'
            }
        }
    }
}