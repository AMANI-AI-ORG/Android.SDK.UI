pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://jfrog.amani.ai/artifactory/amani-sdk"
        }

        // Optional AmaniSpeechVerifier module (compileOnly in :amani-sdk-v1; consumed by apps
        // that use the speech `ST` step). Published to its own JFrog repo key.
        maven {
            url = "https://jfrog.amani.ai/artifactory/amani-speech-verifier"
        }

        maven {
            url = "https://jitpack.io"
        }
    }
}
rootProject.name = "AmaniSDKUI"

include ':app'                  // Sample that runs the AmaniSDK module

include ':amani-sdk-v1'    // Module that is responsible for only usage
                                // of AmaniSDK in proper and fully configurable way
